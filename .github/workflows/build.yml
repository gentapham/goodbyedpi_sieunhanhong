name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build SieuNhanHong.exe
        shell: cmd
        run: build.bat

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SieuNhanHong
          path: SieuNhanHong.exe

      # Release tag comes from AssemblyVersion, so bumping the version is enough to publish
      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = [regex]::Match((Get-Content SieuNhanHong.cs -Raw), 'AssemblyVersion\("(\d+\.\d+\.\d+)').Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          "exists=$(if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Siêu Nhân Hồng ${{ steps.ver.outputs.tag }}
          files: SieuNhanHong.exe
          generate_release_notes: true
