name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build SieuNhanHong.exe
        shell: cmd
        run: build.bat

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SieuNhanHong
          path: SieuNhanHong.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SieuNhanHong.exe
          generate_release_notes: true
